name: PinCraft scheduled publishing

on:
  schedule:
    # Best-effort 30-minute checks, offset from the busiest minute.
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: pincraft-production-worker
  cancel-in-progress: false

jobs:
  publish-due-content:
    # Historical Pinterest API workflow, NOT the selected reviewed Blogger runner.
    # Remains off unless a legacy operator deliberately opts in; never enable
    # this alongside the Blogger automatic + manual Pinterest rollout.
    if: github.repository == 'gmrony135/PinCraft' && github.event.repository.private == false && github.ref == 'refs/heads/main' && vars.LEGACY_PINTEREST_API_SCHEDULER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the production worker with a short-lived workload identity
        shell: bash
        env:
          WORKER_URL: https://pincraftly.vercel.app/api/internal/automation/tick
        run: |
          set -euo pipefail
          TOKEN_JSON="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Fpincraftly.vercel.app%2Fapi%2Finternal%2Fautomation%2Ftick")"
          WORKLOAD_TOKEN="$(printf '%s' "$TOKEN_JSON" | python3 -c 'import sys,json; print(json.load(sys.stdin)["value"])')"
          echo "::add-mask::${WORKLOAD_TOKEN}"
          unset TOKEN_JSON
          # No user credentials, provider tokens or request-body job injection.
          # No automatic HTTP retry: the next delivery recovers saved checkpoints.
          curl --fail --silent --show-error --connect-timeout 15 --max-time 240 \
            -X POST -H "Authorization: Bearer ${WORKLOAD_TOKEN}" \
            -H 'Content-Type: application/json' --data '{}' "${WORKER_URL}"
