<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>আমার ওয়েবসাইট — শীঘ্রই আসছে</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: radial-gradient(1200px 600px at 50% -10%, #1e293b 0%, #0b1120 60%, #060a14 100%);
    color: #e2e8f0;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Bengali", sans-serif;
    padding: 24px;
    text-align: center;
  }
  .card {
    max-width: 560px;
    padding: 48px 40px;
    border-radius: 24px;
    background: rgba(30, 41, 59, .55);
    border: 1px solid rgba(148, 163, 184, .18);
    box-shadow: 0 24px 60px -20px rgba(0, 0, 0, .8);
    backdrop-filter: blur(12px);
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: #7dd3fc;
    background: rgba(56, 189, 248, .12);
    border: 1px solid rgba(56, 189, 248, .3);
    padding: 6px 14px;
    border-radius: 999px;
    margin-bottom: 26px;
  }
  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #22d3ee;
    box-shadow: 0 0 0 4px rgba(34, 211, 238, .18);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: .35; } }
  h1 {
    font-size: clamp(28px, 5vw, 40px);
    line-height: 1.25;
    font-weight: 700;
    letter-spacing: -.02em;
    background: linear-gradient(120deg, #f8fafc, #93c5fd 60%, #a78bfa);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 16px;
  }
  p { color: #94a3b8; font-size: 16px; line-height: 1.75; }
  .pipe {
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: 8px; margin-top: 32px; font-size: 13px; color: #64748b;
  }
  .pipe span {
    padding: 6px 12px; border-radius: 8px;
    background: rgba(148, 163, 184, .08);
    border: 1px solid rgba(148, 163, 184, .14);
  }
</style>
</head>
<body>
  <main class="card">
    <div class="badge"><span class="dot"></span> Deployed</div>
    <h1>আমার ওয়েবসাইট শীঘ্রই আসছে</h1>
    <p>GitHub + Vercel অটো-ডিপ্লয় সেটআপ সম্পন্ন। এখন ওয়েবসাইটের ডিজাইন তৈরি হচ্ছে — প্রতিবার কোড push হলে এই সাইট নিজে থেকেই আপডেট হবে।</p>
    <div class="pipe">
      <span>GitHub</span><span>→</span><span>Auto Push</span><span>→</span><span>Vercel</span><span>→</span><span>Live</span>
    </div>
  </main>
</body>
</html>
